### model
model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
image_max_pixels: 15840400
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 128
# Include the vision-tower and projector FFN layers in the LoRA targets.
lora_target: linear_fc1,linear_fc2,gate_proj,up_proj,down_proj,vision_tower.vision_model.encoder.layers.*.mlp.fc1,vision_tower.vision_model.encoder.layers.*.mlp.fc2,mm_projector.0,mm_projector.2

### dataset
dataset: Multi-Task_Fine-Tuning_Dataset
template: qwen3_vl_nothink
cutoff_len: 12280
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/Qwen3-VL-8B-Instruct/lora/Multi-Task_Fine-tuned_MLLM
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
